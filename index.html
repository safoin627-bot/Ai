<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Generator</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #05050a; color: #eaeaf2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px; overflow: hidden; position: relative;
  }
  /* drifting glow blobs */
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%;
    filter: blur(140px); pointer-events: none; z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  body::before { width: 520px; height: 520px; background: #5865F2; opacity: .45; top: -180px; left: -160px; }
  body::after  { width: 460px; height: 460px; background: #EB459E; opacity: .38; bottom: -200px; right: -140px; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(70px, 50px) scale(1.18); } }

  /* grain overlay */
  body > .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .card {
    position: relative; z-index: 1; width: 100%; max-width: 520px;
    background: rgba(16,16,24,.72); border: 1px solid rgba(255,255,255,.09);
    border-radius: 22px; padding: 26px 24px 22px;
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.07);
    animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }

  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #57F287;
    box-shadow: 0 0 14px #57F287; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; box-shadow: 0 0 4px #57F287; } }
  h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .04em;
    background: linear-gradient(90deg, #b9c0ff, #ffb9ec);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { font-size: 12px; color: #7a7a92; margin: 0 0 22px; letter-spacing: .06em; }

  label { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: #8a8aa0; margin: 0 0 8px 2px; font-weight: 700; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

  textarea, input, select {
    width: 100%; border: 1px solid rgba(255,255,255,.09);
    background: rgba(6,6,12,.75); color: #eaeaf2;
    font-size: 15px; font-family: inherit;
    padding: 13px 14px; border-radius: 12px; outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.5; margin-bottom: 14px; }
  input::placeholder, textarea::placeholder { color: #55556a; }
  textarea:focus, input:focus, select:focus {
    border-color: rgba(88,101,242,.85);
    box-shadow: 0 0 0 4px rgba(88,101,242,.18);
    background: rgba(9,9,16,.95);
  }
  select { appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #8a8aa0 50%), linear-gradient(135deg, #8a8aa0 50%, transparent 50%);
    background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  select option { background: #0a0a12; color: #eaeaf2; }

  button.generate {
    width: 100%; border: none; cursor: pointer;
    padding: 16px; border-radius: 13px;
    font-size: 15px; font-weight: 700; letter-spacing: .03em;
    color: #fff; font-family: inherit;
    background: linear-gradient(135deg, #5865F2 0%, #8b5cf6 50%, #EB459E 100%);
    background-size: 200% 200%;
    box-shadow: 0 12px 34px rgba(88,101,242,.4);
    transition: transform .15s, box-shadow .25s, background-position .45s;
  }
  button.generate:hover { background-position: 100% 0; box-shadow: 0 14px 42px rgba(235,69,158,.45); }
  button.generate:active { transform: scale(.985); }
  button.generate:disabled { opacity: .55; cursor: wait; transform: none; }
  .spin { display: none; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 8px; }
  button.generate.loading .spin { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status { font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center;
    letter-spacing: .02em; opacity: 0; transform: translateY(-4px); transition: all .25s; }
  #status.show { opacity: 1; transform: none; }
  #status.ok  { color: #57F287; text-shadow: 0 0 14px rgba(87,242,135,.55); }
  #status.err { color: #ED4245; text-shadow: 0 0 14px rgba(237,66,69,.55); }
  #status.busy { color: #b9c0ff; }

  .progress { height: 3px; background: rgba(255,255,255,.06); border-radius: 3px;
    margin-top: 12px; overflow: hidden; display: none; }
  .progress.show { display: block; }
  .progress .bar { height: 100%; width: 30%;
    background: linear-gradient(90deg, #5865F2, #EB459E);
    border-radius: 3px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

  .result { margin-top: 18px; display: none; }
  .result.show { display: block; animation: rise .4s ease both; }
  video { width: 100%; border-radius: 13px; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 12px 40px rgba(0,0,0,.6); display: block; background: #000; }
  .download { display: block; text-align: center; margin-top: 10px; font-size: 12px;
    color: #b9c0ff; text-decoration: none; letter-spacing: .05em; }
  .download:hover { color: #ffb9ec; }

  .keyrow { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .keyrow input { margin: 0; flex: 1; font-size: 13px; padding: 10px 12px; }
</style>
</head>
<body>
<div class="grain"></div>

<div class="card">
  <div class="head"><span class="dot"></span><h1>AI Video Generator</h1></div>
  <p class="sub">prompt → motion</p>

  <label for="key">replicate api key (saved locally)</label>
  <div class="keyrow">
    <input id="key" type="password" placeholder="r8_..." spellcheck="false" autocomplete="off">
  </div>

  <label for="prompt">prompt</label>
  <textarea id="prompt" placeholder="a neon city at night, rain, cinematic dolly shot, 24fps..."></textarea>

  <div class="row">
    <div>
      <label for="model">model</label>
      <select id="model">
        <option value="svd">Stable Video Diffusion</option>
        <option value="animatediff">AnimateDiff</option>
        <option value="kling">Kling 1.6</option>
      </select>
    </div>
    <div>
      <label for="img">start image (optional)</label>
      <input id="img" placeholder="https://..." spellcheck="false">
    </div>
  </div>

  <button class="generate" id="go"><span class="spin"></span><span class="lbl">Generate</span></button>
  <div class="progress" id="prog"><div class="bar"></div></div>
  <div id="status"></div>

  <div class="result" id="result">
    <video id="vid" controls playsinline></video>
    <a class="download" id="dl" download="video.mp4">↓ download</a>
  </div>
</div>

<script>
const REPLICATE = 'https://api.replicate.com/v1';
const MODELS = {
  svd:         'stability-ai/stable-video-diffusion:3f0457e4619daac51203dedb472816fd4af51f3149fa7a9e0b5ffcf1b8172438',
  animatediff: 'lucataco/animate-diff:beecf59c4aee8d81bf04f0381033dfa10dd2e16dc8cc00d8912a8a1a8f8f5f1e',
  kling:       'kwaivgi/kling-v1.6-standard:latest'
};

const $ = id => document.getElementById(id);
const keyEl = $('key'), promptEl = $('prompt'), modelEl = $('model'), imgEl = $('img');
const go = $('go'), lbl = go.querySelector('.lbl'), status = $('status'),
      prog = $('prog'), result = $('result'), vid = $('vid'), dl = $('dl');

keyEl.value = localStorage.getItem('r8key') || '';
keyEl.addEventListener('input', () => localStorage.setItem('r8key', keyEl.value));

function setStatus(text, kind) {
  status.textContent = text;
  status.className = 'show ' + (kind || '');
}

go.addEventListener('click', async () => {
  const key = keyEl.value.trim();
  const prompt = promptEl.value.trim();
  const model = modelEl.value;
  const image_url = imgEl.value.trim() || undefined;

  if (!key)    return setStatus('paste your replicate key first', 'err');
  if (!prompt) return setStatus('prompt required', 'err');

  go.disabled = true; go.classList.add('loading');
  lbl.textContent = 'generating...';
  result.classList.remove('show');
  setStatus('sending to replicate...', 'busy');
  prog.classList.add('show');

  try {
    const version = MODELS[model];
    const input = { prompt };
    if (image_url) input.input_image = image_url;

    const r = await fetch(`${REPLICATE}/predictions`, {
      method: 'POST',
      headers: { 'Authorization': `Token ${key}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ version, input })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || data.error || ('http ' + r.status));

    setStatus('rendering... this can take a minute', 'busy');
    poll(key, data.id);
  } catch (e) {
    setStatus('error: ' + e.message, 'err');
    reset();
  }
});

async function poll(key, id) {
  try {
    const r = await fetch(`${REPLICATE}/predictions/${id}`, {
      headers: { 'Authorization': `Token ${key}` }
    });
    const data = await r.json();

    if (data.status === 'succeeded') {
      const url = Array.isArray(data.output) ? data.output[0] : data.output;
      vid.src = url;
      dl.href = url;
      result.classList.add('show');
      setStatus('done', 'ok');
      reset();
    } else if (data.status === 'failed' || data.status === 'canceled') {
      setStatus('failed: ' + (data.error || 'unknown'), 'err');
      reset();
    } else if (data.status === 'processing') {
      setStatus('rendering ' + (data.metrics?.predict_time ? '(' + data.metrics.predict_time.toFixed(1) + 's)' : '...'), 'busy');
      setTimeout(() => poll(key, id), 3000);
    } else {
      setStatus('queued...', 'busy');
      setTimeout(() => poll(key, id), 3000);
    }
  } catch (e) {
    setStatus('poll error: ' + e.message, 'err');
    reset();
  }
}

function reset() {
  go.disabled = false; go.classList.remove('loading');
  lbl.textContent = 'Generate';
  prog.classList.remove('show');
}
</script>
</body>
</html>
